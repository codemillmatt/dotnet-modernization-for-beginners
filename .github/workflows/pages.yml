name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/content
          cp -R webpage/. _site/
          cp README.md LICENSE _site/content/

          for chapter in 00-introduction 01-assessment 02-planning 03-upgrade-execution 04-cloud; do
            cp -R "$chapter" "_site/content/$chapter"
          done

      - name: Generate Mermaid SVGs
        shell: bash
        run: |
          npm install --global --no-audit --no-fund --allow-scripts=puppeteer @mermaid-js/mermaid-cli@11.16.0
          node webpage/tools/render-mermaid.mjs _site/content _site/diagrams

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1