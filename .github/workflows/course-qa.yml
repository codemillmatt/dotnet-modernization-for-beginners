name: Course QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install documentation QA tools
        run: npm ci

      - name: Lint Markdown
        run: npm run qa:markdown

      - name: Check links, assets, terminology, PII, secrets, and accessibility
        shell: pwsh
        run: ./scripts/Test-CourseContent.ps1

  # The site is generated from the chapter Markdown, so a content change can break
  # the build (a missing title, an orphan `parent`) without touching site/ at all.
  # Build it on every pull request rather than discovering that on a push to main.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Check internal links
        run: npm run check-links
        working-directory: site

  modernized-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore checkpoints/03-modernized/BookCatalog.slnx
          dotnet restore checkpoints/04-validated/BookCatalog.Validation.slnx

      - name: Build the modernized checkpoint
        run: dotnet build checkpoints/03-modernized/BookCatalog.slnx --configuration Release --no-restore

      - name: Run the worked validation suite
        run: dotnet test checkpoints/04-validated/BookCatalog.Validation.slnx --configuration Release

      - name: Format-check, lint, and compile Bicep
        run: |
          az bicep format \
            --file checkpoints/05-cloud-ready/infra/main.bicep \
            --outfile "$RUNNER_TEMP/main.formatted.bicep"
          diff -u checkpoints/05-cloud-ready/infra/main.bicep "$RUNNER_TEMP/main.formatted.bicep"
          az bicep build --file checkpoints/05-cloud-ready/infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

  legacy-baseline:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore legacy solution
        shell: pwsh
        run: nuget restore .\shared-legacy-app\BookCatalog.sln

      - name: Build legacy solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          & $msbuild .\shared-legacy-app\BookCatalog.sln /p:Configuration=Release /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm the sample ships no test project
        shell: pwsh
        run: |
          # The legacy sample is deliberately untested. Chapter 03 asks learners to write
          # the characterization tests themselves, so a test project appearing here would
          # silently invalidate that exercise.
          $tests = Get-ChildItem .\shared-legacy-app -Recurse -Filter *.csproj |
            Where-Object { (Get-Content $_.FullName -Raw) -match 'Microsoft\.NET\.Test\.Sdk' }
          if ($tests) { throw "Unexpected test project in shared-legacy-app: $($tests.FullName)" }
