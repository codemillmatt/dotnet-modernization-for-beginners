name: Course validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: dotnet test tests/BookCatalog.Tests/BookCatalog.Tests.csproj --configuration Release
      - run: az bicep build --file examples/azure/main.bicep --outfile "${{ runner.temp }}/bookcatalog-arm.json"
      - run: npm run build
      - run: npm run test:content
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
  windows-legacy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the isolated legacy application
        shell: powershell
        run: ./scripts/Test-LegacyApp.ps1
