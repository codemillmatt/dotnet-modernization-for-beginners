<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="illustration-architecture-dark-title illustration-architecture-dark-desc" data-illustration="architecture" data-era="2000s-2010s" data-theme="dark">
  <title id="illustration-architecture-dark-title">Follow one request</title>
  <desc id="illustration-architecture-dark-desc">The browser sends a request to BooksController. The controller uses its injected ApplicationDbContext for data access to BookCatalogModernizedLab, and data returns to the context. The controller selects a Razor view. The view renders HTML back to the browser; the view does not query the database directly. Solid arrows show requests or data access, and dashed arrows show the response or returned data.</desc>
