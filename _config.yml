title: .NET Modernization for Beginners
description: >-
  Upgrade a tested ASP.NET MVC 5 and EF6 application to .NET 10 and migrate it to
  Azure using GitHub Copilot modernization.
url: https://codemillmatt.github.io
baseurl: /dotnet-modernization-for-beginners

theme: just-the-docs

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

# Rewrites relative links to Markdown files into the rendered page URLs, so the
# same link works when browsing the repository on GitHub and on the Pages site.
relative_links:
  enabled: true
  collections: false

search_enabled: true
search:
  heading_level: 3
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
color_scheme: light

# Just the Docs loads Mermaid from jsDelivr when a version is set. Without this,
# ```mermaid blocks render as plain code instead of diagrams.
mermaid:
  version: "11.16.0"

aux_links:
  "View on GitHub":
    - "https://github.com/codemillmatt/dotnet-modernization-for-beginners"
aux_links_new_tab: true

nav_external_links:
  - title: "GitHub Copilot modernization docs"
    url: "https://learn.microsoft.com/dotnet/core/porting/github-copilot-app-modernization/overview"

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  danger:
    title: Stop
    color: red

footer_content: >-
  MIT licensed. Course content and Azure pricing change; verify against the linked
  Microsoft Learn pages before running a workshop.

# Every page uses the theme layout; without this Jekyll emits bare HTML fragments
# with no navigation, search, or styling.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - package.json
  - package-lock.json
  - work/
  - scripts/
  - shared-legacy-app/
  - checkpoints/01-assessment/
  - checkpoints/02-planning/
  - checkpoints/03-modernized/
  - checkpoints/04-validated/
  - checkpoints/05-cloud-ready/
  - checkpoints/06-azure/
  - checkpoints/07-capstone/
  - .markdownlint-cli2.jsonc
  - CAPTURE-LIST.md
