<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="illustration-azure-dark-title illustration-azure-dark-desc" data-illustration="azure" data-era="2020s" data-theme="dark">
  <title id="illustration-azure-dark-title">A proposed home in Azure</title>
  <desc id="illustration-azure-dark-desc">Proposed target, not an existing deployment. Disposable sample data only. A public sample user sends HTTPS requests to App Service running BookCatalog. The application accesses Key Vault for its connection setting and Azure SQL for Books. Its runtime managed identity authorizes access to both Key Vault and SQL. Separately, an approved administrator performs one-time schema setup and a selected-record copy into Azure SQL. Solid arrows are runtime requests or access; the dashed arrow is one-time administrator setup, not runtime identity.</desc>
