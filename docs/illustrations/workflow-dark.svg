<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="illustration-workflow-dark-title illustration-workflow-dark-desc" data-illustration="workflow" data-era="1970s" data-theme="dark">
  <title id="illustration-workflow-dark-title">Move forward. Look back.</title>
  <desc id="illustration-workflow-dark-desc">The workflow runs in order: Assess, inspect source and risks; Plan, choose changes and checks; Execute, change the application; Review, you compare evidence. If requirements are missed, the dashed correction route returns from Review to Plan.</desc>
