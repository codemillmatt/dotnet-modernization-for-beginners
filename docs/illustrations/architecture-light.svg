<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="illustration-architecture-light-title illustration-architecture-light-desc" data-illustration="architecture" data-era="2000s-2010s" data-theme="light">
  <title id="illustration-architecture-light-title">Follow one request</title>
  <desc id="illustration-architecture-light-desc">The browser sends a request to BooksController. The controller uses its injected ApplicationDbContext for data access to BookCatalogModernizedLab, and data returns to the context. The controller selects a Razor view. The view renders HTML back to the browser; the view does not query the database directly. Solid arrows show requests or data access, and dashed arrows show the response or returned data.</desc>
  <defs>
    <marker id="illustration-architecture-light-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L11 6 1 11Z" fill="#155b91"/></marker>
    <marker id="illustration-architecture-light-return" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L11 6 1 11" fill="none" stroke="#476073" stroke-width="2"/></marker>
    <marker id="illustration-architecture-light-trail" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6 1 11Z" fill="#ffffff"/></marker>
    <linearGradient id="illustration-architecture-light-glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#eaf3fa"/><stop offset="1" stop-color="#dbe9f3"/></linearGradient>
      <linearGradient id="illustration-architecture-light-metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66bfdf"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#448dbd"/></linearGradient>
  </defs>
