  <title id="illustration-investigation-light-title">Follow the evidence</title>
  <desc id="illustration-investigation-light-desc">An investigation desk follows an evidence trail in five numbered steps: 1 Finding, 2 Inspect source, 3 Affected behavior, 4 Choose action, and 5 Define check. Findings are investigated before an action and a verification check are chosen.</desc>
