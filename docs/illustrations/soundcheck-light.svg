  <title id="illustration-soundcheck-light-title">Soundcheck: get ready</title>
  <desc id="illustration-soundcheck-light-desc">A concert poster with three numbered tickets: 1 Check tools and Copilot access; 2 Open the BookCatalog solution in a learner copy; 3 Run the app, add a sample book, and edit it. Already set up? Go straight to running BookCatalog. Flowing ribbons connect the tickets, but the body instructions remain plain and readable.</desc>
