  <title id="illustration-soundcheck-dark-title">Trick-or-treat: get ready</title>
  <desc id="illustration-soundcheck-dark-desc">Three trick-or-treat tickets show the setup sequence: 1 Check tools and Copilot access; 2 Open the BookCatalog solution in a learner copy; 3 Run the app, add a sample book, and edit it. Already set up? Go straight to running BookCatalog. Friendly ghosts and candy colors decorate the tickets, but the body instructions remain plain and readable.</desc>
